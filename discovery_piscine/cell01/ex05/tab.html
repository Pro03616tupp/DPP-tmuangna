<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>

    table {
        border-collapse: collapse;
        width: 100%;
    }

    td {

        width: 50%;
        height: 100px;
        border: 1px solid black;
    }

    .first {

        background-color: rgb(6, 245, 18);

    }

    .second {
        
        background-color: rgb(248, 12, 12);

    }
    
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first">First </td>
            <td class="second">Second </td>
        </tr>
    </table>
</body>
</html>
