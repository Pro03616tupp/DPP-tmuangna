<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax</title>
  <link rel="stylesheet" href="parallax.css">
</head>
<body>
  <main>
    <section class="photo photo-first" aria-label="ภาพช่วงแรก">
      <h1>เริ่มต้นการเดินทาง</h1>
    </section>

    <section class="message" aria-label="ข้อความคั่นกลาง">
      <p>ทุกการเดินทางมีเรื่องราวให้ค้นพบ</p>
    </section>

    <section class="photo photo-second" aria-label="ภาพช่วงสุดท้าย">
      <h2>แล้วพบกันที่ปลายทาง</h2>
    </section>
  </main>
</body>
</html>
