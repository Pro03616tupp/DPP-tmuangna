<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 60px;
        }

        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 300px;
            max-width: 100%;
            height: auto;
        }

        .shop a {
            display: block;
            margin-top: 10px;
        }

        hr {
            margin-top: 30px;
        }

        footer {
            text-align: right;  
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1> GAME SHOP &#9827;</h1>

    <div class="image-container"> 
        <div class="shop">
            <img src="/home/tmuangna/DPP-tmuangna/discovery_piscine/cell10/ex04/img/itch.oi.png"
                 alt="itch.io">
            <a href="https://itch.io/"> 
                itch.io 
            </a>
        </div>

        <div class="shop">
            <img src="/home/tmuangna/DPP-tmuangna/discovery_piscine/cell10/ex04/img/steam.jpg"
                 alt="steam">
            <a href="https://store.steampowered.com/">
                steam
            </a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; tmuangna 2026
    </footer>

</body>
</html>
